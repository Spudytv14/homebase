<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HomeBase · 3 Dashboards</title>
  <!-- Font Awesome 6 (Free) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
  <style>
    /* ----- RESET & BASE ----- */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
    body {
      background: #f4f7fb;
      color: #1a2634;
      padding: 16px;
    }
    button {
      cursor: pointer;
      border: none;
      border-radius: 8px;
      font-weight: 600;
      padding: 8px 16px;
      background: #eef2f6;
      transition: 0.15s;
    }
    button:hover { opacity: 0.8; transform: scale(0.97); }
    input, select, textarea {
      border: 1px solid #d0d9e4;
      border-radius: 8px;
      padding: 10px 14px;
      font-size: 0.95rem;
      width: 100%;
      background: #fff;
    }
    input:focus, select:focus { outline: 2px solid #2a7de1; border-color: transparent; }
    .container { max-width: 1400px; margin: 0 auto; }

    /* ----- HEADER / TOP NAV ----- */
    .topbar {
      background: #0a1a2b;
      color: white;
      padding: 12px 28px;
      border-radius: 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }
    .topbar .logo {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .topbar .logo span { color: #ffb347; }
    .topbar .role-switcher {
      display: flex;
      gap: 8px;
      background: #1e3347;
      padding: 6px 10px;
      border-radius: 40px;
    }
    .topbar .role-switcher button {
      background: transparent;
      color: #a0b8ce;
      padding: 6px 18px;
      border-radius: 30px;
      font-size: 0.85rem;
      font-weight: 500;
    }
    .topbar .role-switcher button.active {
      background: #ffb347;
      color: #0a1a2b;
    }
    .topbar .user-badge {
      background: #1e3347;
      padding: 6px 16px 6px 12px;
      border-radius: 40px;
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 0.9rem;
    }
    .topbar .user-badge i { color: #ffb347; }

    /* ----- DASHBOARD WRAPPER ----- */
    .dash-section {
      display: none;
      animation: fade 0.25s ease;
    }
    .dash-section.active { display: block; }
    @keyframes fade { from { opacity: 0.3; } to { opacity: 1; } }

    /* cards */
    .stat-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }
    .stat-card {
      background: white;
      padding: 20px 18px;
      border-radius: 16px;
      box-shadow: 0 4px 10px rgba(0,0,0,0.02);
      border: 1px solid #e9edf2;
    }
    .stat-card h3 { font-size: 0.85rem; font-weight: 500; color: #5b6f82; letter-spacing: 0.3px; }
    .stat-card .number { font-size: 2.2rem; font-weight: 700; margin-top: 4px; color: #0a1a2b; }

    .panel {
      background: white;
      border-radius: 16px;
      padding: 20px 24px;
      border: 1px solid #e9edf2;
      margin-bottom: 28px;
      overflow-x: auto;
    }
    .panel h2 {
      font-size: 1.25rem;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .panel h2 i { color: #2a7de1; }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.9rem;
    }
    th {
      text-align: left;
      padding: 12px 8px 12px 0;
      border-bottom: 2px solid #e9edf2;
      color: #3f5568;
      font-weight: 600;
    }
    td {
      padding: 12px 8px 12px 0;
      border-bottom: 1px solid #f0f3f7;
      vertical-align: middle;
    }
    .badge {
      background: #e5f0ff;
      color: #1f5eb7;
      padding: 4px 12px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }
    .badge.green { background: #dff0e0; color: #1f7840; }
    .badge.red { background: #ffe7e5; color: #b33c34; }
    .badge.orange { background: #ffefe0; color: #b36b1f; }

    .btn-primary { background: #2a7de1; color: white; }
    .btn-success { background: #1f8b4c; color: white; }
    .btn-danger { background: #d1453b; color: white; }
    .btn-outline { background: transparent; border: 1px solid #d0d9e4; }

    /* ----- TENANT DASHBOARD ----- */
    .filter-bar {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 14px;
      background: white;
      padding: 18px 20px;
      border-radius: 16px;
      border: 1px solid #e9edf2;
      margin-bottom: 24px;
      align-items: end;
    }
    .filter-bar label { font-size: 0.75rem; font-weight: 600; color: #3f5568; display: block; margin-bottom: 4px; }
    .filter-bar .vacancy-toggle {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-top: 6px;
    }
    .filter-bar .vacancy-toggle input { width: auto; margin-right: 4px; }

    .property-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
      gap: 24px;
    }
    .property-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid #e9edf2;
      transition: 0.15s;
    }
    .property-card:hover { box-shadow: 0 8px 20px rgba(0,0,0,0.05); }
    .property-card .img-placeholder {
      height: 160px;
      background: #d9e2ed;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #5b6f82;
      font-weight: 500;
      font-size: 0.9rem;
    }
    .property-card .body {
      padding: 16px 18px 18px;
    }
    .property-card .body .price { font-size: 1.4rem; font-weight: 700; color: #0a1a2b; }
    .property-card .body .title { font-weight: 600; margin: 6px 0 4px; }
    .property-card .body .meta { color: #5b6f82; font-size: 0.85rem; display: flex; gap: 16px; }
    .property-card .body .status-badge {
      margin-top: 12px;
      display: inline-block;
      padding: 4px 14px;
      border-radius: 30px;
      font-size: 0.75rem;
      font-weight: 600;
    }

    /* ----- LANDLORD DASHBOARD ----- */
    .landlord-props {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .lprop-item {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      background: #fafcff;
      padding: 14px 18px;
      border-radius: 12px;
      border: 1px solid #e9edf2;
    }
    .lprop-item .info { flex: 2; min-width: 180px; }
    .lprop-item .info strong { display: block; }
    .lprop-item .info span { font-size: 0.85rem; color: #3f5568; }
    .lprop-item .actions { display: flex; gap: 8px; flex-wrap: wrap; }

    .modal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(3px);
      justify-content: center;
      align-items: center;
      z-index: 999;
    }
    .modal.active { display: flex; }
    .modal-content {
      background: white;
      max-width: 520px;
      width: 94%;
      padding: 28px 30px;
      border-radius: 24px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.2);
      position: relative;
    }
    .modal-content .close {
      position: absolute;
      top: 16px;
      right: 22px;
      font-size: 1.5rem;
      cursor: pointer;
      color: #6f8aa3;
    }
    .modal-content form { display: flex; flex-direction: column; gap: 16px; }

    /* admin tabs */
    .admin-tabs {
      display: flex;
      gap: 6px;
      margin-bottom: 20px;
      background: #f0f4fa;
      padding: 4px;
      border-radius: 40px;
      width: fit-content;
    }
    .admin-tabs button {
      background: transparent;
      padding: 8px 24px;
      border-radius: 30px;
      font-weight: 500;
    }
    .admin-tabs button.active { background: white; box-shadow: 0 2px 6px rgba(0,0,0,0.04); }

    .admin-pane { display: none; }
    .admin-pane.active { display: block; }

    /* Responsive */
    @media (max-width: 700px) {
      .topbar { flex-direction: column; align-items: stretch; gap: 12px; }
      .topbar .role-switcher { justify-content: center; }
      .topbar .user-badge { justify-content: center; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
      .filter-bar { grid-template-columns: 1fr 1fr; }
    }
    @media (max-width: 480px) {
      .stat-grid { grid-template-columns: 1fr; }
      .property-grid { grid-template-columns: 1fr; }
    }

    .mt-2 { margin-top: 12px; }
    .flex { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  </style>
</head>
<body>
<div class="container">

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="logo">Home<span>Base</span></div>
    <div class="role-switcher">
      <button class="active" data-role="tenant"><i class="fas fa-search"></i> Tenant</button>
      <button data-role="landlord"><i class="fas fa-building"></i> Landlord</button>
      <button data-role="admin"><i class="fas fa-user-cog"></i> Admin</button>
    </div>
    <div class="user-badge">
      <i class="fas fa-circle" style="color:#2ecc71; font-size: 0.6rem;"></i>
      <span id="activeUserDisplay">Tenant · Tinashe M.</span>
    </div>
  </header>

  <!-- ============================================================ -->
  <!-- TENANT DASHBOARD -->
  <!-- ============================================================ -->
  <section id="tenantDash" class="dash-section active">
    <div class="filter-bar">
      <div>
        <label><i class="fas fa-search"></i> Search</label>
        <input type="text" id="tenantSearch" placeholder="e.g. Borrowdale, Flat..." oninput="renderTenant()">
      </div>
      <div>
        <label><i class="fas fa-map-pin"></i> Location</label>
        <select id="tenantLocation" onchange="renderTenant()">
          <option value="all">All Cities</option>
          <option value="Harare">Harare</option>
          <option value="Bulawayo">Bulawayo</option>
          <option value="Gweru">Gweru</option>
          <option value="Mutare">Mutare</option>
        </select>
      </div>
      <div>
        <label><i class="fas fa-dollar-sign"></i> Max Price</label>
        <input type="number" id="tenantMaxPrice" placeholder="e.g. 800" oninput="renderTenant()">
      </div>
      <div>
        <label><i class="fas fa-bed"></i> Rooms</label>
        <select id="tenantRooms" onchange="renderTenant()">
          <option value="any">Any</option>
          <option value="1">1</option>
          <option value="2">2</option>
          <option value="3">3</option>
          <option value="4">4+</option>
        </select>
      </div>
      <div class="vacancy-toggle">
        <label style="margin:0; display:flex; align-items:center; gap:6px;">
          <input type="checkbox" id="tenantVacantOnly" checked onchange="renderTenant()">
          <span style="font-weight:500;">Vacant only</span>
        </label>
      </div>
    </div>

    <div id="tenantPropertyGrid" class="property-grid"></div>
    <div id="tenantNoResult" style="display:none; text-align:center; padding:40px; color:#5b6f82;">No properties match your filters.</div>
  </section>

  <!-- ============================================================ -->
  <!-- LANDLORD DASHBOARD -->
  <!-- ============================================================ -->
  <section id="landlordDash" class="dash-section">
    <div class="stat-grid" id="landlordStats"></div>
    <div class="panel">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;">
        <h2><i class="fas fa-list-ul"></i> My Properties</h2>
        <button class="btn-primary" onclick="openAddProperty()"><i class="fas fa-plus"></i> Add Property</button>
      </div>
      <div id="landlordPropertyList" class="landlord-props mt-2"></div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- ADMIN DASHBOARD -->
  <!-- ============================================================ -->
  <section id="adminDash" class="dash-section">
    <div class="stat-grid" id="adminStats"></div>

    <div class="panel">
      <div class="admin-tabs">
        <button class="active" data-admin-tab="transactions"><i class="fas fa-receipt"></i> Transactions</button>
        <button data-admin-tab="users"><i class="fas fa-users"></i> Users</button>
        <button data-admin-tab="verifications"><i class="fas fa-check-circle"></i> Verifications</button>
      </div>

      <div id="adminPaneTransactions" class="admin-pane active">
        <h3 style="margin-bottom:12px;">All Transactions</h3>
        <table><thead><tr><th>ID</th><th>Tenant</th><th>Landlord</th><th>Property</th><th>Amount</th><th>EcoCash Ref</th><th>Status</th></tr></thead><tbody id="adminTransactionTable"></tbody></table>
      </div>

      <div id="adminPaneUsers" class="admin-pane">
        <h3 style="margin-bottom:12px;">User Registry</h3>
        <table><thead><tr><th>Name</th><th>Email/Phone</th><th>Role</th><th>Status</th></tr></thead><tbody id="adminUserTable"></tbody></table>
      </div>

      <div id="adminPaneVerifications" class="admin-pane">
        <h3 style="margin-bottom:12px;">Verification Queue</h3>
        <table><thead><tr><th>Landlord</th><th>Document</th><th>Submitted</th><th>Actions</th></tr></thead><tbody id="adminVerificationTable"></tbody></table>
      </div>
    </div>
  </section>

  <!-- ============================================================ -->
  <!-- MODAL: Add Property (Landlord) -->
  <!-- ============================================================ -->
  <div id="addPropertyModal" class="modal">
    <div class="modal-content">
      <span class="close" onclick="closeAddProperty()">&times;</span>
      <h2><i class="fas fa-home"></i> List New Property</h2>
      <form id="addPropertyForm" onsubmit="handleAddProperty(event)">
        <input type="text" id="propTitle" placeholder="Property title (e.g. Cozy 2-bed flat)" required>
        <input type="text" id="propLocation" placeholder="City (e.g. Harare)" required>
        <input type="number" id="propPrice" placeholder="Monthly rent (USD)" required>
        <input type="number" id="propRooms" placeholder="Bedrooms" required min="1">
        <select id="propStatus" required>
          <option value="vacant">Vacant</option>
          <option value="occupied">Occupied</option>
        </select>
        <textarea id="propDesc" placeholder="Short description" rows="2"></textarea>
        <div style="display:flex; gap:12px; justify-content:flex-end;">
          <button type="button" class="btn-outline" onclick="closeAddProperty()">Cancel</button>
          <button type="submit" class="btn-success"><i class="fas fa-plus"></i> Add Property</button>
        </div>
      </form>
    </div>
  </div>

</div>
<script>
// ========================================================================
//  DATA STORE (simulated)
// ========================================================================
let properties = [
  { id: 1, landlordId: 1, title: 'Modern 2-bed Apartment', location: 'Harare', price: 450, rooms: 2, status: 'vacant', desc: 'Secure complex, solar backup.' },
  { id: 2, landlordId: 1, title: 'Spacious Family House', location: 'Bulawayo', price: 780, rooms: 4, status: 'occupied', desc: 'Large yard, 3 baths.' },
  { id: 3, landlordId: 2, title: 'Cozy Studio', location: 'Harare', price: 220, rooms: 1, status: 'vacant', desc: 'Ideal for student, near campus.' },
  { id: 4, landlordId: 2, title: 'Executive 3-bed', location: 'Gweru', price: 620, rooms: 3, status: 'vacant', desc: 'Furnished, backup water.' },
  { id: 5, landlordId: 1, title: 'Garden Cottage', location: 'Mutare', price: 310, rooms: 1, status: 'vacant', desc: 'Quiet area, parking.' },
  { id: 6, landlordId: 3, title: 'Duplex 4-bed', location: 'Harare', price: 1100, rooms: 4, status: 'occupied', desc: 'Premium security estate.' },
  { id: 7, landlordId: 3, title: 'Affordable Room', location: 'Bulawayo', price: 160, rooms: 1, status: 'vacant', desc: 'Shared kitchen, water incl.' },
  { id: 8, landlordId: 2, title: 'Family Home 3-bed', location: 'Mutare', price: 540, rooms: 3, status: 'vacant', desc: 'Near CBD, tiled floors.' },
];
let users = [
  { id: 1, name: 'Tinashe M.', contact: 'tinashe@email.com', role: 'tenant', status: 'active' },
  { id: 2, name: 'Tanaka D.', contact: 'tanaka@email.com', role: 'tenant', status: 'active' },
  { id: 3, name: 'Landlord John', contact: 'john@prop.co.zw', role: 'landlord', status: 'verified' },
  { id: 4, name: 'Landlord Grace', contact: 'grace@rentals.co.zw', role: 'landlord', status: 'pending' },
  { id: 5, name: 'Admin Prime', contact: 'admin@homebase.co.zw', role: 'admin', status: 'active' },
];
let transactions = [
  { id: 'TXN001', tenant: 'Tinashe M.', landlord: 'Landlord John', property: 'Modern 2-bed Apartment', amount: 2, ref: 'EC123456', status: 'Success' },
  { id: 'TXN002', tenant: 'Tanaka D.', landlord: 'Landlord Grace', property: 'Cozy Studio', amount: 2, ref: 'EC987654', status: 'Success' },
  { id: 'TXN003', tenant: 'Tinashe M.', landlord: 'Landlord John', property: 'Spacious Family House', amount: 2, ref: 'EC456789', status: 'Failed' },
  { id: 'TXN004', tenant: 'Tafadzwa R.', landlord: 'Landlord Grace', property: 'Executive 3-bed', amount: 2, ref: 'EC111222', status: 'Success' },
  { id: 'TXN005', tenant: 'Kudzai P.', landlord: 'Landlord John', property: 'Garden Cottage', amount: 2, ref: 'EC333444', status: 'Success' },
];
let verifications = [
  { id: 1, landlord: 'Landlord Grace', document: 'Title Deed (Uploaded)', submitted: '2026-07-08', status: 'pending' },
  { id: 2, landlord: 'Landlord Peter', document: 'Rates Bill (Uploaded)', submitted: '2026-07-09', status: 'pending' },
];

// helper: generate unique id
let nextPropId = 9;
let nextVerifId = 3;

// current logged in landlord for demo (fixed to ID 3 = Landlord Grace)
const CURRENT_LANDLORD_ID = 3; 

// ========================================================================
//  RENDER: TENANT
// ========================================================================
function renderTenant() {
  const search = document.getElementById('tenantSearch').value.toLowerCase();
  const location = document.getElementById('tenantLocation').value;
  const maxPrice = parseFloat(document.getElementById('tenantMaxPrice').value) || Infinity;
  const rooms = document.getElementById('tenantRooms').value;
  const vacantOnly = document.getElementById('tenantVacantOnly').checked;

  let filtered = properties.filter(p => {
    if (vacantOnly && p.status !== 'vacant') return false;
    if (location !== 'all' && p.location !== location) return false;
    if (p.price > maxPrice) return false;
    if (rooms !== 'any') {
      const roomNum = parseInt(rooms);
      if (roomNum === 4 && p.rooms < 4) return false;
      if (roomNum < 4 && p.rooms !== roomNum) return false;
    }
    if (search && !p.title.toLowerCase().includes(search) && !p.location.toLowerCase().includes(search)) return false;
    return true;
  });

  const grid = document.getElementById('tenantPropertyGrid');
  const noResult = document.getElementById('tenantNoResult');
  if (!filtered.length) { grid.innerHTML = ''; noResult.style.display = 'block'; return; }
  noResult.style.display = 'none';

  grid.innerHTML = filtered.map(p => `
    <div class="property-card">
      <div class="img-placeholder"><i class="fas fa-image" style="margin-right:6px;"></i> ${p.location}</div>
      <div class="body">
        <div class="price">$${p.price}</div>
        <div class="title">${p.title}</div>
        <div class="meta"><span><i class="fas fa-bed"></i> ${p.rooms} bed</span> <span><i class="fas fa-map-pin"></i> ${p.location}</span></div>
        <span class="status-badge ${p.status === 'vacant' ? 'badge green' : 'badge red'}">${p.status.toUpperCase()}</span>
        <div style="margin-top:12px;"><button class="btn-primary" style="width:100%;">Unlock Contact · $2</button></div>
        <div style="font-size:0.75rem; color:#6f8aa3; margin-top:6px;">${p.desc || ''}</div>
      </div>
    </div>
  `).join('');
}

// ========================================================================
//  RENDER: LANDLORD
// ========================================================================
function renderLandlord() {
  const myProps = properties.filter(p => p.landlordId === CURRENT_LANDLORD_ID);
  const vacant = myProps.filter(p => p.status === 'vacant').length;
  const occupied = myProps.filter(p => p.status === 'occupied').length;

  document.getElementById('landlordStats').innerHTML = `
    <div class="stat-card"><h3>Total Properties</h3><div class="number">${myProps.length}</div></div>
    <div class="stat-card"><h3>Vacant</h3><div class="number" style="color:#1f7840;">${vacant}</div></div>
    <div class="stat-card"><h3>Occupied</h3><div class="number" style="color:#b33c34;">${occupied}</div></div>
  `;

  const list = document.getElementById('landlordPropertyList');
  if (!myProps.length) { list.innerHTML = '<p style="color:#5b6f82;">You have not listed any properties yet.</p>'; return; }

  list.innerHTML = myProps.map(p => `
    <div class="lprop-item">
      <div class="info">
        <strong>${p.title}</strong>
        <span><i class="fas fa-dollar-sign"></i> ${p.price} · ${p.rooms} bed · ${p.location}</span>
        <span style="display:inline-block; margin-left:12px;" class="badge ${p.status === 'vacant' ? 'green' : 'red'}">${p.status}</span>
      </div>
      <div class="actions">
        <button class="btn-outline" style="font-size:0.8rem;" onclick="togglePropertyStatus(${p.id})">
          <i class="fas fa-sync-alt"></i> Mark ${p.status === 'vacant' ? 'Occupied' : 'Vacant'}
        </button>
        <button class="btn-danger" style="font-size:0.8rem;" onclick="removeProperty(${p.id})">
          <i class="fas fa-trash"></i> Remove
        </button>
      </div>
    </div>
  `).join('');
}

function togglePropertyStatus(id) {
  const prop = properties.find(p => p.id === id);
  if (!prop) return;
  prop.status = prop.status === 'vacant' ? 'occupied' : 'vacant';
  renderLandlord();
  renderTenant(); // keep tenant view in sync
}

function removeProperty(id) {
  if (!confirm('Remove this property listing?')) return;
  properties = properties.filter(p => p.id !== id);
  renderLandlord();
  renderTenant();
}

// ========================================================================
//  MODAL: ADD PROPERTY (Landlord)
// ========================================================================
function openAddProperty() {
  document.getElementById('addPropertyModal').classList.add('active');
}
function closeAddProperty() {
  document.getElementById('addPropertyModal').classList.remove('active');
  document.getElementById('addPropertyForm').reset();
}
function handleAddProperty(e) {
  e.preventDefault();
  const title = document.getElementById('propTitle').value.trim();
  const location = document.getElementById('propLocation').value.trim();
  const price = parseFloat(document.getElementById('propPrice').value);
  const rooms = parseInt(document.getElementById('propRooms').value);
  const status = document.getElementById('propStatus').value;
  const desc = document.getElementById('propDesc').value.trim();

  if (!title || !location || !price || !rooms) return alert('Please fill all required fields.');

  const newProp = {
    id: nextPropId++,
    landlordId: CURRENT_LANDLORD_ID,
    title,
    location,
    price,
    rooms,
    status,
    desc: desc || 'New listing.',
  };
  properties.push(newProp);
  closeAddProperty();
  renderLandlord();
  renderTenant();
  alert('Property added successfully!');
}

// ========================================================================
//  RENDER: ADMIN
// ========================================================================
function renderAdmin() {
  // stats
  const totalUsers = users.length;
  const totalProps = properties.length;
  const totalRevenue = transactions.filter(t => t.status === 'Success').reduce((sum, t) => sum + t.amount, 0);
  document.getElementById('adminStats').innerHTML = `
    <div class="stat-card"><h3>Total Users</h3><div class="number">${totalUsers}</div></div>
    <div class="stat-card"><h3>Total Properties</h3><div class="number">${totalProps}</div></div>
    <div class="stat-card"><h3>Revenue (USD)</h3><div class="number">$${totalRevenue}</div></div>
    <div class="stat-card"><h3>Pending Verifications</h3><div class="number">${verifications.filter(v=>v.status==='pending').length}</div></div>
  `;

  // transactions
  const tbody = document.getElementById('adminTransactionTable');
  tbody.innerHTML = transactions.map(t => `
    <tr>
      <td><strong>${t.id}</strong></td>
      <td>${t.tenant}</td>
      <td>${t.landlord}</td>
      <td>${t.property}</td>
      <td>$${t.amount}</td>
      <td>${t.ref}</td>
      <td><span class="badge ${t.status === 'Success' ? 'green' : 'red'}">${t.status}</span></td>
    </tr>
  `).join('');

  // users
  const ubody = document.getElementById('adminUserTable');
  ubody.innerHTML = users.map(u => `
    <tr>
      <td><strong>${u.name}</strong></td>
      <td>${u.contact}</td>
      <td><span class="badge">${u.role}</span></td>
      <td><span class="badge ${u.status === 'active' || u.status === 'verified' ? 'green' : 'orange'}">${u.status}</span></td>
    </tr>
  `).join('');

  // verifications
  const vbody = document.getElementById('adminVerificationTable');
  vbody.innerHTML = verifications.map(v => `
    <tr>
      <td><strong>${v.landlord}</strong></td>
      <td>${v.document}</td>
      <td>${v.submitted}</td>
      <td>
        ${v.status === 'pending' ? `
          <button class="btn-success" style="font-size:0.75rem; padding:4px 12px;" onclick="approveVerification(${v.id})"><i class="fas fa-check"></i> Approve</button>
          <button class="btn-danger" style="font-size:0.75rem; padding:4px 12px;" onclick="rejectVerification(${v.id})"><i class="fas fa-times"></i> Reject</button>
        ` : `<span class="badge">${v.status}</span>`}
      </td>
    </tr>
  `).join('');
}

function approveVerification(id) {
  const v = verifications.find(v => v.id === id);
  if (v) { v.status = 'approved'; 
    // also update user status
    const user = users.find(u => u.name === v.landlord);
    if (user) user.status = 'verified';
  }
  renderAdmin();
}
function rejectVerification(id) {
  const v = verifications.find(v => v.id === id);
  if (v) { v.status = 'rejected'; }
  renderAdmin();
}

// ========================================================================
//  NAVIGATION & TAB SWITCHING
// ========================================================================
function switchDashboard(role) {
  document.querySelectorAll('.dash-section').forEach(el => el.classList.remove('active'));
  document.getElementById(role + 'Dash').classList.add('active');

  document.querySelectorAll('.role-switcher button').forEach(b => b.classList.remove('active'));
  document.querySelector(`.role-switcher button[data-role="${role}"]`).classList.add('active');

  // update user display
  const names = { tenant: 'Tenant · Tinashe M.', landlord: 'Landlord · Grace (ID 3)', admin: 'Admin · Prime' };
  document.getElementById('activeUserDisplay').innerText = names[role] || 'User';

  // re-render specific dashboards
  if (role === 'tenant') renderTenant();
  if (role === 'landlord') renderLandlord();
  if (role === 'admin') renderAdmin();
}

// Admin sub-tabs
document.querySelectorAll('[data-admin-tab]').forEach(btn => {
  btn.addEventListener('click', function() {
    document.querySelectorAll('[data-admin-tab]').forEach(b => b.classList.remove('active'));
    this.classList.add('active');
    const target = this.dataset.adminTab;
    document.querySelectorAll('.admin-pane').forEach(p => p.classList.remove('active'));
    document.getElementById('adminPane' + target.charAt(0).toUpperCase() + target.slice(1)).classList.add('active');
  });
});

// Role switcher
document.querySelectorAll('.role-switcher button').forEach(btn => {
  btn.addEventListener('click', function() {
    switchDashboard(this.dataset.role);
  });
});

// ========================================================================
//  INIT
// ========================================================================
// start with tenant
switchDashboard('tenant');

// Close modal on outside click
document.getElementById('addPropertyModal').addEventListener('click', function(e) {
  if (e.target === this) closeAddProperty();
});
</script>
</body>
